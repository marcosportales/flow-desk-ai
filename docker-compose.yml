name: flowdesk

x-app-image: &app-image
  build: .
  image: flowdesk-app
  env_file: .env

x-app: &app
  <<: *app-image
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowdesk
      POSTGRES_PASSWORD: flowdesk
      POSTGRES_DB: flowdesk
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdesk -d flowdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app-image
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    <<: *app
    command: ["pnpm", "worker"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s = require('fs').statSync('/tmp/worker-heartbeat'); process.exit(Date.now() - s.mtimeMs < 30000 ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  n8n-import:
    image: n8nio/n8n:2.43.7
    env_file: .env
    environment: &n8n-env
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n
      # Code nodes read FLOWDESK_TO_N8N_SECRET / N8N_TO_FLOWDESK_SECRET via
      # $env and sign with the crypto builtin (IMPLEMENTATION.md §5).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: UTC
      # The workflow's `erp` branch; defaulted so an older .env still works.
      ERP_URL: ${ERP_URL:-http://erp:4100}
    entrypoint: ["/bin/sh", "/import.sh"]
    restart: "no"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./docker/n8n-import.sh:/import.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:2.43.7
    env_file: .env
    environment: *n8n-env
    restart: unless-stopped
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully

  notifier:
    build: services/notifier
    restart: unless-stopped
    ports:
      - "${NOTIFIER_HOST_PORT:-4000}:4000"
    volumes:
      - notifier-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6

  # Simulated ERP: the `erp` Category's target (ADR 0009).
  erp:
    build: services/erp
    restart: unless-stopped
    ports:
      - "${ERP_HOST_PORT:-4100}:4100"
    volumes:
      - erp-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4100/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6

  # Optional public tunnel for a cloud Workflow Engine (ADR 0011):
  # `docker compose --profile power-automate up -d`, then `pnpm tunnel:url`.
  # A cloudflared quick tunnel needs no Cloudflare account; its URL changes
  # on every restart.
  tunnel-proxy:
    image: caddy:2.10.2-alpine
    profiles: [power-automate]
    restart: unless-stopped
    volumes:
      - ./docker/tunnel/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
      - notifier
      - erp

  tunnel:
    image: cloudflare/cloudflared:2025.8.1
    profiles: [power-automate]
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - --url
      - http://tunnel-proxy:8080
    # Metrics only, on loopback: pnpm tunnel:url reads /quicktunnel here.
    ports:
      - "127.0.0.1:${TUNNEL_METRICS_HOST_PORT:-2000}:2000"
    depends_on:
      - tunnel-proxy

volumes:
  postgres-data:
  n8n-data:
  notifier-data:
  erp-data:
